plugins {
    alias(libs.plugins.agp.application)
    alias(libs.plugins.kotlin.android)
}

android {
    compileSdk COMPILE_SDK
    namespace "com.poweramp.v3.sampleskin"

    defaultConfig {
        applicationId "com.ars.audioproduction.liquidglass"
        minSdk MIN_SDK
        targetSdk TARGET_SDK
        versionCode 2
        versionName "1.0"
    }

    // Use a persistent keystore from GitHub Actions secrets when configured.
    // Without it, Gradle's ephemeral runner debug key changes between workflow runs.
    def arsStoreFile = System.getenv("ARS_KEYSTORE_PATH")
    def arsStorePassword = System.getenv("ARS_STORE_PASSWORD")
    def arsKeyAlias = System.getenv("ARS_KEY_ALIAS")
    def arsKeyPassword = System.getenv("ARS_KEY_PASSWORD")
    def hasStableSigning = arsStoreFile && arsStorePassword && arsKeyAlias && arsKeyPassword

    if (hasStableSigning) {
        signingConfigs {
            arsStable {
                storeFile file(arsStoreFile)
                storePassword arsStorePassword
                keyAlias arsKeyAlias
                keyPassword arsKeyPassword
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.arsStable
            }
        }
    } else {
        logger.warn("ARS stable signing secrets are not configured; this APK will use the runner's temporary debug key and may not update over an existing install.")
    }

    compileOptions {
        sourceCompatibility = JAVA_SOURCE_COMPATIBILITY
        targetCompatibility = JAVA_TARGET_COMPATIBILITY
    }
    lint {
        disable 'ResAuto', 'MissingTranslation', 'OnClick', 'ExtraTranslation'
    }

    androidResources {
        def localProps = new Properties()
        localProps.load(rootProject.file("local.properties").newDataInputStream())
        def paResources = localProps['poweramp.apk'] ?: "Poweramp-build-1026-resources.zip"
        println "Using $paResources PA resources"

        def params = []

        params += ["--emit-ids", "${projectDir}/stable-ids.txt", "--package-id", "0x80",  "-I", "${projectDir}/../${paResources}"]

        if(project.file("stable-ids.txt").exists()) {
            println "Got stable-ids OK"
            params += ["--stable-ids", "${projectDir}/stable-ids.txt"]
        } else {
            println "WARNING: no stable-ids.txt specified"
        }

        additionalParameters = params
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(path: ':poweramp_api_lib')
    implementation libs.androidx.appcompat.resources
    implementation libs.androidx.core.ktx
}
